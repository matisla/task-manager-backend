[project]
name = "task-manager-backend"
version = "0.1.0"
description = "Backend for the Task Manager app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "pwdlib[argon2]>=0.3.0",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "python-dateutil>=2.9.0.post0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.51.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.18.5",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
]

[tool.pyright]
venv = ".venv"
venvPath = "."

[dependency-groups]
dev = ["black>=26.5.1", "pip>=26.1.2", "ruff>=0.16.0"]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.9.1",
    "factory-boy>=3.3.3",
    "faker>=40.36.0",
]

[tool.pytest.ini_options]
pythonpath = ["app"]
addopts = ["-ras", "-vv", "--cov=app", "--cov-report=html"]
log_level = "DEBUG"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
# prevent ruff to fix (and break) database definition: UP006/UP007/UP037/UP045
# rewrite quoted forward references (eg. `Optional["Task"]`, `list["Task"]`) into
# their unquoted form, which crashes at import time on SQLModel's Relationship()
# string forward refs (or on TYPE_CHECKING-only imports).
"**/models.py" = ["UP006", "UP007", "UP037", "UP045"]

[tool.black]
line-length = 100
target-version = ["py314"]
