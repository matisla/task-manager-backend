services:
  app:
    build: .
    container_name: fastapi_app
    ports:
      - 8000:8000
    environment:
      DATABASE_URL: ""
      DATABASE_TYPE: postgresql
      DATABASE_NAME: tasksmanager
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres_pwd
      LOG_LEVEL: DEBUG
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app
    networks:
      - task-manager
  db:
    image: postgres:latest
    restart: always
    container_name: postgres_db
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: tasksmanager
      POSTGRES_PASSWORD: postgres_pwd
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasksmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - task-manager

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - task-manager

volumes:
  postgres_data:

networks:
  task-manager:
